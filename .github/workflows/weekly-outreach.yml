name: Weekly Outreach Email

# Triggered by cron-job.org via workflow_dispatch (same pattern as the
# Monday brief). GitHub's native schedule trigger is not used on purpose.
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run outreach script
        env:
          HUBSPOT_TOKEN: ${{ secrets.OUTREACH_HUBSPOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_FROM_EMAIL: ${{ secrets.BRIEF_FROM_EMAIL }}
          BRIEF_TO_EMAIL: ${{ secrets.BRIEF_TO_EMAIL }}
        run: python weekly_outreach.py

      - name: Commit sent log (prevents repeat picks)
        run: |
          git config user.name "outreach-bot"
          git config user.email "outreach-bot@users.noreply.github.com"
          git add sent_log.json
          git diff --cached --quiet || git commit -m "outreach sent log $(date +%F)"
          git push
